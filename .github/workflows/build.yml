name: ArtisanArc Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Clean Flutter project
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Generate icons
        run: flutter pub run flutter_launcher_icons

      - name: Generate splash screen
        run: flutter pub run flutter_native_splash:create

      - name: Generate mocks
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test

      - name: Configure persistent release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/artisanarc-personal-release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=app/artisanarc-personal-release.jks\n' \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties
            echo "Persistent Android release signing configured."
          else
            echo "No release-signing secrets available; using the local debug signing fallback."
          fi

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Remove temporary signing material
        if: always()
        run: rm -f android/key.properties android/app/artisanarc-personal-release.jks

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: artisan-arc-apk
          path: build/app/outputs/flutter-apk/app-release.apk
